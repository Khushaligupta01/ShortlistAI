name: ShortlistAI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Migrations & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortlist
          POSTGRES_PASSWORD: shortlist_dev
          POSTGRES_DB: shortlistai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://shortlist:shortlist_dev@localhost:5432/shortlistai_test
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Full Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://shortlist:shortlist_dev@localhost:5432/shortlistai_test
          AI_PROVIDER: fallback
          JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars-long
        run: |
          cd backend
          pytest tests/ -v

  frontend-check:
    name: Frontend Lint, Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm run build

